[package]
name = "datagoblin"
version = "0.1.3"
description = "A small SQL workbench for PostgreSQL and SQL Server"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "chrono", "rust_decimal"] }
futures-util = "0.3"
chrono = "0.4"
rust_decimal = "1"
uuid = "1"
same-file = "1"
tempfile = "3"
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
